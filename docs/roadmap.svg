<svg viewBox="0 0 900 400" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="900" y2="400" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0f0f0f"/>
      <stop offset="100%" stop-color="#1a1a2e"/>
    </linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1DB954"/>
      <stop offset="100%" stop-color="#1ed760"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4A90D9"/>
      <stop offset="100%" stop-color="#5BA3EC"/>
    </linearGradient>
    <linearGradient id="purple" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#9B59B6"/>
      <stop offset="100%" stop-color="#B07CC6"/>
    </linearGradient>
    <filter id="glow-green" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="glow-blue" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="900" height="400" rx="12" fill="url(#bg)"/>

  <!-- Title -->
  <text x="450" y="42" text-anchor="middle" fill="#f0f0f0" font-size="24" font-weight="700" letter-spacing="0.5">message-miner</text>
  <text x="450" y="64" text-anchor="middle" fill="#888" font-size="12" letter-spacing="2">ROADMAP</text>

  <!-- Connector lines -->
  <line x1="295" y1="178" x2="345" y2="178" stroke="#333" stroke-width="2" stroke-dasharray="6,4"/>
  <line x1="555" y1="178" x2="605" y2="178" stroke="#333" stroke-width="2" stroke-dasharray="6,4"/>

  <!-- Arrows -->
  <polygon points="345,178 337,173 337,183" fill="#555"/>
  <polygon points="605,178 597,173 597,183" fill="#444"/>

  <!-- Phase 1 — Complete -->
  <rect x="80" y="96" width="215" height="164" rx="12" fill="none" stroke="url(#green)" stroke-width="2" filter="url(#glow-green)"/>
  <rect x="80" y="96" width="215" height="164" rx="12" fill="rgba(29,185,84,0.06)"/>
  <rect x="80" y="96" width="215" height="32" rx="12" fill="url(#green)"/>
  <rect x="80" y="112" width="215" height="16" fill="url(#green)"/>
  <text x="187" y="117" text-anchor="middle" fill="#fff" font-size="12" font-weight="700" letter-spacing="1.5">PHASE 1</text>

  <text x="187" y="152" text-anchor="middle" fill="#f0f0f0" font-size="15" font-weight="600">Teams Chat</text>
  <text x="187" y="172" text-anchor="middle" fill="#aaa" font-size="11">Explore messaging data</text>
  <line x1="116" y1="188" x2="258" y2="188" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  <text x="187" y="208" text-anchor="middle" fill="#1DB954" font-size="11" font-weight="600">Output</text>
  <text x="187" y="224" text-anchor="middle" fill="#ccc" font-size="11">Your Messages, Wrapped</text>

  <rect x="148" y="236" width="78" height="20" rx="10" fill="rgba(29,185,84,0.2)"/>
  <text x="162" y="250" text-anchor="middle" fill="#1DB954" font-size="11" font-weight="700">✓</text>
  <text x="198" y="250" text-anchor="middle" fill="#1DB954" font-size="9.5" font-weight="600">Complete</text>

  <!-- Phase 2 — In Progress -->
  <rect x="345" y="96" width="210" height="164" rx="12" fill="none" stroke="url(#blue)" stroke-width="2" filter="url(#glow-blue)"/>
  <rect x="345" y="96" width="210" height="164" rx="12" fill="rgba(74,144,217,0.06)"/>
  <rect x="345" y="96" width="210" height="32" rx="12" fill="url(#blue)"/>
  <rect x="345" y="112" width="210" height="16" fill="url(#blue)"/>
  <text x="450" y="117" text-anchor="middle" fill="#fff" font-size="12" font-weight="700" letter-spacing="1.5">PHASE 2</text>

  <text x="450" y="152" text-anchor="middle" fill="#f0f0f0" font-size="15" font-weight="600">Email + Meetings</text>
  <text x="450" y="172" text-anchor="middle" fill="#aaa" font-size="11">Explore mail &amp; transcript data</text>
  <line x1="381" y1="188" x2="519" y2="188" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  <text x="450" y="208" text-anchor="middle" fill="#4A90D9" font-size="11" font-weight="600">Output</text>
  <text x="450" y="224" text-anchor="middle" fill="#ccc" font-size="11">TBD — Report?</text>

  <rect x="408" y="236" width="84" height="20" rx="10" fill="rgba(74,144,217,0.2)"/>
  <circle cx="422" cy="246" r="3" fill="#4A90D9"/>
  <text x="457" y="250" text-anchor="middle" fill="#4A90D9" font-size="9.5" font-weight="600">In Progress</text>

  <!-- Phase 3 -->
  <rect x="605" y="96" width="215" height="164" rx="12" fill="none" stroke="#9B59B6" stroke-width="1.5" opacity="0.5"/>
  <rect x="605" y="96" width="215" height="164" rx="12" fill="rgba(155,89,182,0.03)"/>
  <rect x="605" y="96" width="215" height="32" rx="12" fill="url(#purple)" opacity="0.5"/>
  <rect x="605" y="112" width="215" height="16" fill="url(#purple)" opacity="0.5"/>
  <text x="712" y="117" text-anchor="middle" fill="#fff" font-size="12" font-weight="700" letter-spacing="1.5">PHASE 3</text>

  <text x="712" y="152" text-anchor="middle" fill="#f0f0f0" font-size="15" font-weight="600" opacity="0.6">Work Intelligence</text>
  <text x="712" y="172" text-anchor="middle" fill="#aaa" font-size="11" opacity="0.5">Chat + Email + Meetings</text>
  <line x1="641" y1="188" x2="783" y2="188" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
  <text x="712" y="208" text-anchor="middle" fill="#9B59B6" font-size="11" font-weight="600" opacity="0.5">Output</text>
  <text x="712" y="224" text-anchor="middle" fill="#999" font-size="11" opacity="0.5">Weekly Digest</text>

  <rect x="673" y="236" width="78" height="20" rx="10" fill="rgba(155,89,182,0.12)"/>
  <circle cx="687" cy="246" r="3" fill="#9B59B6" opacity="0.4"/>
  <text x="717" y="250" text-anchor="middle" fill="#9B59B6" font-size="9.5" font-weight="600" opacity="0.5">Exploring</text>

  <!-- Phase 3 detail panel -->
  <rect x="80" y="290" width="740" height="88" rx="10" fill="rgba(155,89,182,0.05)" stroke="#9B59B6" stroke-width="1" opacity="0.35"/>

  <text x="100" y="314" fill="#9B59B6" font-size="11" font-weight="700" letter-spacing="1" opacity="0.6">PHASE 3 VISION</text>

  <text x="100" y="336" fill="#aaa" font-size="11.5" opacity="0.6">A living ranked digest of your work — topics, decisions, questions, action items, people — tracked over time.</text>
  <text x="100" y="354" fill="#aaa" font-size="11.5" opacity="0.6">Each item has a full history and a latest status. Things rise, fall, appear, go stale. Updated weekly.</text>
  <text x="100" y="372" fill="#666" font-size="10.5" opacity="0.5">What Copilot can't do: longitudinal baselines, cross-channel tracking, drift detection, pattern recognition across months of data.</text>

  <!-- Tagline -->
  <text x="450" y="396" text-anchor="middle" fill="#444" font-size="10.5">Mine your Microsoft 365 data. Understand how you communicate.</text>
</svg>
